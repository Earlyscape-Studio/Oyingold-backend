# .github/workflows/auto-promote-dev-to-staging.yml
name: Auto PR and Merge Dev to Staging

on:
  push:
    branches:
      - dev

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Attempt Merge (fail on conflict)
        run: |
          git fetch origin staging:staging
          git checkout staging

          if ! git merge origin/dev -m "Chore: Auto-merge dev into staging"; then
            echo "::error::Merge conflict between dev and staging. Resolve manually."
            git merge --abort
            exit 1
          fi

          git push origin staging