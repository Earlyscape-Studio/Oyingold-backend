name: Auto PR and Merge Dev to Staging

on:
  push:
    branches:
      - dev

permissions:
  pull-requests: write
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or find PR from dev to staging
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          existing=$(gh pr list --base staging --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "number=$existing" >> "$GITHUB_OUTPUT"
          else
            url=$(gh pr create --base staging --head dev \
              --title "Chore: Promote dev to staging" \
              --body "Automated PR promoting dev into staging.")
            echo "number=$(echo "$url" | grep -o '[0-9]*$')" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.number }}"