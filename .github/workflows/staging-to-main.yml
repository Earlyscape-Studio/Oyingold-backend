# .github/workflows/auto-promote-staging-to-main.yml
name: Auto PR and Merge Staging to Main

on:
  push:
    branches:
      - staging

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Attempt Merge (fail on conflict)
        run: |
          git fetch origin main:main
          git checkout main

          if ! git merge origin/staging -m "Chore: Auto-merge staging into main"; then
            echo "::error::Merge conflict between staging and main. Resolve manually."
            git merge --abort
            exit 1
          fi

          git push origin main